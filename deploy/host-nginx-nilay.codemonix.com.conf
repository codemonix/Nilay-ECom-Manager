# Host-level Nginx server block (runs outside Docker, directly on the
# Lightsail instance) for nilay.codemonix.com. This instance may host
# other sites too -- this file only owns this one domain.
#
# Install:
#   sudo cp deploy/host-nginx-nilay.codemonix.com.conf \
#       /etc/nginx/sites-available/nilay.codemonix.com.conf
#   sudo ln -s /etc/nginx/sites-available/nilay.codemonix.com.conf \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nilay.codemonix.com
#
# Certbot rewrites this file in place to add ssl_certificate directives and
# an HTTP->HTTPS redirect -- don't hand-edit those sections afterwards.
#
# The proxy_pass port (8081) must match APP_PORT in this project's .env.

server {
    listen 80;
    server_name nilay.codemonix.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
