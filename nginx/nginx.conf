# In-container gateway: serves the built SPA and reverse-proxies API +
# upload requests to the api service by its Docker Compose service name.
# This container is itself reverse-proxied by the host-level Nginx that
# terminates TLS for nilay.codemonix.com -- see deploy/host-nginx-*.conf.

server {
    listen 80;
    server_name _;

    # Matches MAX_UPLOAD_SIZE_MB (attachments) and the order-import xlsx
    # limit (25MB) with headroom.
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
