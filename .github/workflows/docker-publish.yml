name: Build and publish images

# Builds apps/api and apps/web (see their Dockerfiles) and pushes them to
# GitHub Container Registry. The Lightsail instance never checks out this
# repo -- it only runs `docker compose pull` against these images, using
# docker-compose.prod.yml.
on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/codemonix/nilay-ecom-manager-api
  IMAGE_WEB: ghcr.io/codemonix/nilay-ecom-manager-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        # VITE_API_URL is baked into the static bundle at build time -- set
        # it once as a repo Actions variable (Settings > Secrets and
        # variables > Actions > Variables), e.g.
        # https://nilay.codemonix.com/api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
